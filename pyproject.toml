[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nba_career_predictor"
version = "0.0.1"
description = "AAdv ML AT1 repo for group 36"
authors = [
  { name = "Aby" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "nba-career-toolkit",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "==3.13.9"


[tool.ruff]
line-length = 99
src = ["nba_career_predictor"]
include = ["pyproject.toml", "nba_career_predictor/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nba_career_predictor"]
force-sort-within-sections = true

[tool.uv.sources]
nba-career-toolkit = { path = "../36120-26SP-group36-26666293-package", editable = true }

