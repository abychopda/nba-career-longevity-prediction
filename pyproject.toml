[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nba_career_predictor-26164448"
version = "0.0.1"
description = "AAdv ML AT1 repo for group 36"
authors = [
  { name = "Raphael Sanbar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "jupyterlab==4.3.4",
    "loguru",
    "matplotlib==3.9.4",
    "mkdocs",
    "nba-career-toolkit",
    "numpy",
    "pandas==2.2.3",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
    "scipy",
    "seaborn==0.13.2",
    "tqdm",
    "typer",
    "utstd>=0.1.9",
    "xgboost==2.1.3",
]

requires-python = "==3.13.9"


[tool.ruff]
line-length = 99
src = ["nba_career_predictor"]
include = ["pyproject.toml", "nba_career_predictor/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["nba_career_predictor"]
force-sort-within-sections = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
nba-career-toolkit-26164448 = { index = "testpypi" }