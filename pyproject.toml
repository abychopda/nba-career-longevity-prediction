[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "36120_26sp_group36_experiments"
version = "0.0.1"
description = "AAdv ML AT1 repo for group 36"
authors = [
  { name = "Aby" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "==3.13.9"


[tool.ruff]
line-length = 99
src = ["36120_26sp_group36_experiments"]
include = ["pyproject.toml", "36120_26sp_group36_experiments/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["36120_26sp_group36_experiments"]
force-sort-within-sections = true

