[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "36120_26sp_group36_experiments"
version = "0.0.1"
description = "AAdv ML AT1 repo for group 36"
authors = [
  { name = "Aby" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "36120-26sp-group36-25611094-package>=0.1.3",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "loguru",
    "matplotlib>=3.11.1",
    "mkdocs",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tqdm",
    "typer",
]

requires-python = "==3.13.9"


[tool.flit.module]
name = "AT1"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
36120-26sp-group36-25611094-package = { index = "testpypi" }

[tool.ruff]
line-length = 99
src = ["AT1"]
include = ["pyproject.toml", "AT1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["AT1"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "36120-26sp-group36-25611094-package==0.1.6",
]
