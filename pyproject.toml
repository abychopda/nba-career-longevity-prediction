[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nba_career_predictor"
version = "0.0.1"
description = "AAdv ML AT1 repo for group 36"
authors = [
  { name = "Aby" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "36120-26sp-group36-25611094-package>=0.1.3",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab==4.3.4",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "loguru",
    "matplotlib==3.9.4",
    "mkdocs",
    "nba-career-toolkit==1.0.0",
    "numpy>=2.5.1",
    "pandas==2.2.3",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "tqdm",
    "typer",
    "utstd>=0.1.9",
    "xgboost==2.1.3",
]

requires-python = "==3.13.9"


[tool.flit.module]
name = "AT1"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
36120-26sp-group36-25611094-package = { index = "testpypi" }
nba-career-toolkit = { index = "testpypi" }

[tool.ruff]
line-length = 99
src = ["nba_career_predictor", "AT1"]
include = ["pyproject.toml", "nba_career_predictor/**/*.py", "AT1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["nba_career_predictor", "AT1"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "36120-26sp-group36-25611094-package==0.1.6",
]
